name: Build Lenovo Y70 6.12.58 main module

on:
  push:
    paths:
      - 'src/**'
      - 'Makefile'
      - 'mk/**'
      - 'deps.lst'
      - '.sdk-version'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-y70:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: ghcr.io/ylarod/ddk-min@sha256:4dd088dc94b391c926cf09215e0a5958f3dfe7d8eeed3616f9041224f85b1d1a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact target source and reference artifacts
        id: target_cache
        uses: actions/cache/restore@v4
        with:
          path: .target
          key: y70-ab14987696-b0a9599c6c01-inputs-v1
      - name: Fetch pinned libraries
        env:
          KMSDK_TOKEN: ${{ secrets.KMSDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${KMSDK_TOKEN}@github.com/".insteadOf "git@github.com:"
          scripts/fetch-deps.sh
      - name: Build against the exact unmodified target kernel
        run: |
          mkdir -p out/y70/report
          bash scripts/build-y70.sh 2>&1 | tee out/y70/report/build.log
      - name: Verify symbol CRCs, namespaces and module metadata
        run: |
          python3 scripts/verify-y70.py --modules out/y70 --reference .target/reference --output out/y70/report/verification.json
          # The unmodified kernel's Rust helper preparation emits a target-triple
          # diagnostic when linking aarch64-unknown-none with C helpers. It is not
          # linked into this C-only LKM. Enforce zero warnings on the LKMs.
          if grep -nE '(^|[[:space:]])(error:|warning:)' out/y70/report/module-build.log; then
            echo 'The module compilation contains errors or warnings.'
            exit 1
          fi
          cd out/y70
          sha256sum droid_lkm.ko droidspaces-check > SHA256SUMS.txt
      - name: Upload validated Y70 main module
        uses: actions/upload-artifact@v4
        with:
          name: droid_lkm-y70-6.12.58-ab14987696
          path: |
            out/y70/droid_lkm.ko
            out/y70/droidspaces-check
            out/y70/SHA256SUMS.txt
            out/y70/report/verification.json
          if-no-files-found: error
      - name: Upload full diagnostic records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y70-build-diagnostics
          path: out/y70/report/
          if-no-files-found: warn
      - name: Cache verified target inputs even if the module build fails
        if: always() && steps.target_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .target
          key: y70-ab14987696-b0a9599c6c01-inputs-v1
